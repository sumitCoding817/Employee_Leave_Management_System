# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT (override JWT_SECRET in every real environment; min 32 characters) ----------
jwt.secret=hdfjdfdhgh235625362hcjdgvhdgfhdgfh362467246274cjdhvjdhfjdgfjdgfhgd
jwt.expiration=86400000

# ---------- CORS (comma separated list of allowed frontend origins) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- Business rules ----------
