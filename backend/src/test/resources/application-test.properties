# Tests run on in-memory H2 (MySQL mode), so no MySQL server is needed.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-secret-key-test-secret-key-test-secret-key-1234
jwt.expiration=3600000

# Calendar days (not weekdays) so leave-day assertions never depend on the day the test runs
app.leave.exclude-weekends=false
